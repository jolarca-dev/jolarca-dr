# pre-commit configuration — jolarca-dr
# Mirrors the checks documented in CONTRIBUTING.md and the CI workflow's `lint`
# and `gitleaks` jobs, so a commit that passes locally is a commit that passes in
# CI. Hooks that only run in CI catch mistakes after they are published.
#
# Install:  pip install pre-commit && pre-commit install
# Run now:  pre-commit run --all-files
#
# Step A of the first-commit pipeline (jolarca-control
# docs/runbooks/first-commit-pipeline.md) refuses to proceed until the hook is
# installed: without it, lint, secret scanning and the hygiene checks below do
# not run before a commit is created.

repos:
  # ── General file hygiene ───────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: forbid-submodules

  # ── Secrets detection ──────────────────────────────────────────────────────
  # Pinned to the same gitleaks release the CI workflow verifies by checksum, so
  # local and CI results cannot disagree because of a version difference.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ── Repository document lint (the `lint` required status check) ────────────
  - repo: local
    hooks:
      - id: lint-docs
        name: Lint DR documents (scripts/lint_docs.py)
        entry: python3 scripts/lint_docs.py
        language: system
        types: [markdown]
        pass_filenames: false
